<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" href="style.css">
    <meta charset="utf-8">
  <title>FeetFirstProduction.
  </title>
  </head>

  
    <body>
      <header>
   <img src ="https://yt3.googleusercontent.com/80VZJmsagX6WQvA30ayeEHqPt69RdVrjum4qpAF_KyA4oH6n78np_Rpncxz1u6aNtvKSgF2eVw=s160-c-k-c0x00ffffff-no-rj" width="150">
        <h1>TITLE FIGHT</h1>
       
      <br>
       
      </header>

      <main>
        <section>
          <h2>Cadastro</h2>
        <form>
          <label for="nome">Nome:
          </label>
          <br>
          <input type="text" 
            id="name" 
            placeholder="Nome Completo"
            required>
          <br><br>
          <label for="email">
            Gmail:
          </label>
          <br>
          <input type="email" 
            id="confirmaremail" 
            placeholder="exemplo@gmail.com" 
            required>
          <br><br>
          <label for="email">
            Confirmar Gmail:
          </label>
          <br>
          <input type="email" 
            id="email" 
            placeholder="exemplo@gmail.com" 
            required>
          <br><br>
          <label for="tel">
            Telefone
          </label>
          <br>
          <input type="tel" 
            id="tel" 
            placeholder="55(81)9999-9999"
            required>
            <br><br>
          
          <label for="sex">
            Sexualidade:
          </label>
          <input type="text" 
            id="sex"
            placeholder="Homem, mulher, trans..."
            required>
          <br><br>

          <label for="cpf">
            CPF:
          </label>
          <input type="text" 
            id="cpf"
            placeholder="000.000.000-00"
            required>
          <br><br>
          <p>Pessoa com deficiencia:
          </p>

          <input type="radio" name="deficiencia" id="escoliose" value="escoliose" required>
    <label for="escoliose">Escoliose</label>

    <input type="radio" name="deficiencia" id="autismo" value="autismo" required>
    <label for="autismo">Autismo</label>

    <input type="radio" name="deficiencia" id="cadeirante" value="cadeirante" required >
    <label for="cadeirante">Cadeirante</label>

           <input type="radio" name="deficiencia" id="nenhuma" value="nenhuma" required>
    <label for="nenhuma">Nenhuma</label>

          <br><br>

         <p>Escolaridade:
         </p>

           <input type="radio" name="escola" id="fundamental 1" value="fundamental 1" required>
    <label for="fundamental 1">Fundamental 1 Completo
    </label>

          <input type="radio" name="escola" id="fundamental 2" value="fundamental 2" required>
    <label for="fundamental 2">Fundamental 2 Completo
    </label>

          <input type="radio" name="escola" id="ensino medio" value="ensino medio" required>
    <label for="ensino medio">Ensino Médio
    </label>
          <br><br>
          <input type="radio" name="escola" id="ensino superior" value="ensino superior" required>
    <label for="ensino superior">Ensino Superior
    </label>
<br><br><br>
          
          <button type="submit">Enviar</button>
<br>
          <a href="https://arthurmateusdasilva7-ui.github.io/feetcompleto/">
          Home
          </a>
         <footer>@FeetFirstProductions</footer>
        </form>
        </section>
      </main>
    </body>
  </html>
